---
- name: reload pf
  ansible.builtin.command: pfctl -f /etc/pf.conf
  listen: reload pf

# - name: reload mountd
#   ansible.builtin.command: service mountd reload
#   listen: reload mountd

- name: restart nfs4 services
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
  loop:
    - nfsuserd
    - nfsd
  listen: restart nfs4 services
